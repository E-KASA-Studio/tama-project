<section attr.aria-label="{{ 'ariaLabel.contacts' | translate }}"
  class="contacts-section relative z-20 w-full bg-main-radial py-16 px-4 min-h-screen
    md:py-24 md:px-8
    xl:py-32 xl:px-16">

  <h2 appScrollReveal class="font-heading bg-gold-gradient bg-clip-text text-transparent
    leading-[1.1] overflow-hidden w-full text-left lg:text-center
    px-2 md:px-6 max-w-none
    mt-[-5vw] md:mt-0
    mb-8 md:mb-20
    text-[7vw] sm:text-[6vw] md:text-[8vw] lg:text-[40px] xl:text-[48px] 2xl:text-[54px]">
    {{ 'contacts.title_1' | translate }}
  </h2>

  <address appScrollReveal class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-7xl mx-auto not-italic">

    <!-- Email -->
    <a
      [href]="emailHref()"
      target="_blank"
      rel="noopener noreferrer"
      class="group flex flex-col items-center justify-center p-10
        border border-brand/30 bg-black/20 backdrop-blur-sm
        transition-all duration-300
        hover:border-brand hover:bg-brand/5">
      <div class="mb-6 text-brand transition-transform duration-300 group-hover:scale-110">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 stroke-[1.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
      </div>
      <span class="text-brand text-lg md:text-xl font-light tracking-wide break-all">
       {{ 'contacts.email' | translate }}
      </span>
    </a>

    <!-- Phone -->
    <a
      [href]="phoneHref()"
      class="group flex flex-col items-center justify-center p-10
        border border-brand/30 bg-black/20 backdrop-blur-sm
        transition-all duration-300
        hover:border-brand hover:bg-brand/5">
      <div class="mb-6 text-brand transition-transform duration-300 group-hover:scale-110">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 stroke-[1.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
        </svg>
      </div>
      <span class="text-brand text-lg md:text-xl font-light tracking-wide">
        {{ 'contacts.phone' | translate }}
      </span>
    </a>

    <!-- Address -->
    <a
      [href]="mapsHref()"
      target="_blank"
      rel="noopener noreferrer"
      class="group flex flex-col items-center justify-center p-10
        border border-brand/30 bg-black/20 backdrop-blur-sm
        transition-all duration-300
        hover:border-brand hover:bg-brand/5">
      <div class="mb-6 text-brand transition-transform duration-300 group-hover:scale-110">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 stroke-[1.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
          <path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </div>
      <p class="text-brand text-lg md:text-xl font-light tracking-wide text-center leading-relaxed">
        {{ 'contacts.address' | translate }}
      </p>
    </a>

  </address>
</section>
