<button
	type="button"
	aria-label="Go up"
	class="fixed right-4 md:right-6 z-[1000] size-12 md:size-14 rounded-full border-2 md:border-[2.5px] border-brand bg-dark flex items-center justify-center cursor-pointer transition-all duration-300 hover:bg-brand/10 hover:border-brand-light focus:outline-2 focus:outline-brand focus:outline-offset-2"
	[style.bottom.px]="bottomOffsetPx">
	<svg aria-hidden="true" viewBox="0 0 28 28" class="w-6 h-6 md:w-7 md:h-7 text-brand">
		<polyline points="2 18 14 5 26 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></polyline>
	</svg>
</button>
