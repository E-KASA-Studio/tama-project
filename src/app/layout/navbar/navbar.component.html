<nav class="navbar">
  <!-- Left: Navigation Menu (Mobile Hamburger / Desktop) -->
  <div class="navbar-left">
    <!-- Hamburger Menu Toggle (Mobile) -->
    <button
      class="hamburger"
      [attr.aria-expanded]="isMenuOpen()"
      aria-label="Toggle navigation menu"
      (click)="toggleMenu()"
    >
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>

    <!-- Navigation Menu -->
    <div class="navbar-menu" [class.active]="isMenuOpen()">
      <ul class="nav-list">
        <li class="nav-item">
          <button class="nav-link" (click)="scrollToSection('company')">
            Company
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" (click)="scrollToSection('product')">
            Product
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" (click)="scrollToSection('contacts')">
            Contacts
          </button>
        </li>
      </ul>
    </div>
  </div>

  <!-- Center: Logo -->
  <div class="navbar-center">
    <a href="#" class="logo">
      <img src="assets/tama-caps-logo.png" alt="TAMA CAPS" class="logo-image" />
    </a>
  </div>

  <!-- Right: Language Switcher -->
  <div class="navbar-right">
    <div class="lang-group">
      <button
        class="lang-btn"
        [class.active]="currentLanguage() === 'en'"
        (click)="setLanguage('en')"
        aria-label="English"
        title="English"
      >
        <img src="assets/flag-en.svg" alt="English flag" class="flag-icon" />
      </button>
      <button
        class="lang-btn"
        [class.active]="currentLanguage() === 'ru'"
        (click)="setLanguage('ru')"
        aria-label="Русский"
        title="Русский"
      >
        <img src="assets/flag-ru.svg" alt="Russian flag" class="flag-icon" />
      </button>
    </div>
  </div>
</nav>
