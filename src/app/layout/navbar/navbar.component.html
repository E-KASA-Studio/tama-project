<nav 
  class="fixed top-0 z-[1000] font-comfortaa
  grid items-center bg-dark/65 backdrop-blur-sm border-b border-brand/20 w-full
  transition-transform duration-300 ease-out
  grid-cols-[auto_1fr_auto_auto] gap-3 p-2.5 min-h-20
  md:grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)] md:gap-4 md:px-6 md:py-3 md:min-h-[74px]
  xl:gap-6 xl:px-10 xl:py-2 xl:min-h-24 animate-fade"
  [ngClass]="isNavbarHidden() ? '-translate-y-full' : 'translate-y-0'">

  <!-- Hamburger + Navigation Links -->
  <div class="flex items-center gap-4 min-w-0
    col-start-4 row-start-1 justify-self-end
    md:col-start-1 md:row-auto md:justify-self-start xl:gap-6">

    <button
      class="group flex flex-col gap-1.5 bg-transparent border-none cursor-pointer p-2 shrink-0
        md:hidden focus:outline-2 focus:outline-brand focus:rounded"
      [attr.aria-expanded]="isMenuOpen()"
      aria-label="Toggle navigation menu"
      (click)="toggleMenu()">
      <span class="hamburger-line block w-6 h-[3px] bg-brand transition-all duration-300 origin-center group-hover:bg-brand-light"></span>
      <span class="hamburger-line block w-6 h-[3px] bg-brand transition-all duration-300 origin-center group-hover:bg-brand-light"></span>
      <span class="hamburger-line block w-6 h-[3px] bg-brand transition-all duration-300 origin-center group-hover:bg-brand-light"></span>
    </button>

    <div
      class="absolute top-full inset-x-0 bg-dark border-t border-[#444] p-4 flex-col
        md:static md:flex md:flex-row md:border-none md:p-0 md:bg-transparent"
      [ngClass]="isMenuOpen() ? 'flex md:flex' : 'hidden md:flex'">
      <ul class="flex flex-col gap-2 list-none m-0 p-0 md:flex-row md:gap-4 xl:gap-6">
        <li class="w-full md:w-auto">
          <a [routerLink]="[]" fragment="company"
            class="block w-full bg-transparent border-none text-brand text-base font-medium
              px-2 py-3 text-left cursor-pointer rounded font-comfortaa transition-all duration-300
              hover:text-brand-light hover:bg-brand/10 focus:text-brand-light focus:bg-brand/10 focus:outline-none
              md:px-0 md:py-2 md:rounded-none xl:text-lg">
            {{ 'nav.company' | translate }}
          </a>
        </li>
        <li class="w-full md:w-auto">
          <a [routerLink]="[]" fragment="product"
            class="block w-full bg-transparent border-none text-brand text-base font-medium
              px-2 py-3 text-left cursor-pointer rounded font-comfortaa transition-all duration-300
              hover:text-brand-light hover:bg-brand/10 focus:text-brand-light focus:bg-brand/10 focus:outline-none
              md:px-0 md:py-2 md:rounded-none xl:text-lg">
            {{ 'nav.product' | translate }}
          </a>
        </li>
        <li class="w-full md:w-auto">
          <a [routerLink]="[]" fragment="contacts"
            class="block w-full bg-transparent border-none text-brand text-base font-medium
              px-2 py-3 text-left cursor-pointer rounded font-comfortaa transition-all duration-300
              hover:text-brand-light hover:bg-brand/10 focus:text-brand-light focus:bg-brand/10 focus:outline-none
              md:px-0 md:py-2 md:rounded-none xl:text-lg">
            {{ 'nav.contacts' | translate }}
          </a>
        </li>
      </ul>
    </div>
  </div>

  <!-- Logo -->
  <div class="flex items-center col-start-1 row-start-1 justify-self-start
    md:col-start-2 md:row-auto md:justify-self-center">
    <a [routerLink]="['/']" fragment="hero"
      class="flex items-center justify-center no-underline transition-transform duration-300
      hover:scale-[1.08] focus:scale-[1.08] focus:outline-none">
      <img src="tama-caps-logo.png" alt="TAMA CAPS"
        class="w-11 h-11 object-contain md:w-[52px] md:h-[52px] xl:w-[72px] xl:h-[72px]" />
    </a>
  </div>

  <!-- Language Switcher -->
  <div class="flex items-center col-start-3 row-start-1 justify-self-end
    md:col-start-3 md:row-auto">
    <div class="flex gap-1.5 items-center bg-brand/10 p-1 rounded-full">
     @for (lang of languages; track lang.code) {
      <button
        type="button"
        class="flex items-center justify-center bg-transparent border border-transparent text-brand
               cursor-pointer p-1.5 size-9 xl:size-11 rounded-full transition-all duration-300
               hover:bg-brand/20 focus:outline-2 focus:outline-brand"
        [ngClass]="{
          'bg-brand text-dark border-brand hover:bg-brand-light hover:border-brand-light': 
           languageService.currentLanguage() === lang.code
        }"
        [attr.aria-label]="lang.code.toUpperCase()"
        [title]="lang.code.toUpperCase()"
        (click)="languageService.switchLanguage(lang.code)">
        
        <img [src]="lang.icon" 
             [alt]="lang.code + ' flag'" 
             class="size-5 xl:size-6 object-contain" />
      </button>
    }
    </div>
  </div>
</nav>
