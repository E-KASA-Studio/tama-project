<nav class="relative sticky top-0 z-[1000] font-comfortaa
  grid items-center bg-dark
  grid-cols-[auto_1fr_auto_auto] gap-3 p-2.5 min-h-20
  md:grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)] md:gap-4 md:px-6 md:py-3 md:min-h-[74px]
  xl:gap-6 xl:px-10 xl:py-2 xl:min-h-24">

  <!-- Hamburger + Navigation Links -->
  <div class="flex items-center gap-4 min-w-0
    col-start-4 row-start-1 justify-self-end
    md:col-start-1 md:row-auto md:justify-self-start xl:gap-6">

    <button
      class="group flex flex-col gap-1.5 bg-transparent border-none cursor-pointer p-2 shrink-0
        md:hidden focus:outline-2 focus:outline-brand focus:rounded"
      [attr.aria-expanded]="isMenuOpen()"
      aria-label="Toggle navigation menu"
      (click)="toggleMenu()">
      <span class="hamburger-line block w-6 h-[3px] bg-brand transition-all duration-300 origin-center group-hover:bg-brand-light"></span>
      <span class="hamburger-line block w-6 h-[3px] bg-brand transition-all duration-300 origin-center group-hover:bg-brand-light"></span>
      <span class="hamburger-line block w-6 h-[3px] bg-brand transition-all duration-300 origin-center group-hover:bg-brand-light"></span>
    </button>

    <div
      class="mobile-menu absolute top-full inset-x-0 bg-dark border-t border-[#444] p-4 flex-col
        md:static md:flex-row md:border-none md:p-0 md:bg-transparent"
      [class.open]="isMenuOpen()">
      <ul class="flex flex-col gap-2 list-none m-0 p-0 md:flex-row md:gap-4 xl:gap-6">
        <li class="w-full md:w-auto">
          <button class="nav-link" (click)="scrollToSection('company')">Company</button>
        </li>
        <li class="w-full md:w-auto">
          <button class="nav-link" (click)="scrollToSection('product')">Product</button>
        </li>
        <li class="w-full md:w-auto">
          <button class="nav-link" (click)="scrollToSection('contacts')">Contacts</button>
        </li>
      </ul>
    </div>
  </div>

  <!-- Logo -->
  <div class="flex items-center col-start-1 row-start-1 justify-self-start
    md:col-start-2 md:row-auto md:justify-self-center">
    <a href="#" class="flex items-center justify-center no-underline transition-transform duration-300
      hover:scale-[1.08] focus:scale-[1.08] focus:outline-none">
      <img src="assets/tama-caps-logo.png" alt="TAMA CAPS"
        class="w-11 h-11 object-contain md:w-[52px] md:h-[52px] xl:w-[72px] xl:h-[72px]" />
    </a>
  </div>

  <!-- Language Switcher -->
  <div class="flex items-center col-start-3 row-start-1 justify-self-end
    md:col-start-3 md:row-auto">
    <div class="flex gap-1.5 items-center bg-brand/10 p-1 rounded-full">
      <button
        class="lang-btn flex items-center justify-center bg-transparent border border-transparent
          cursor-pointer p-1.5 size-9 xl:size-11 rounded-full transition-all duration-300
          hover:bg-brand/20 focus:outline-2 focus:outline-brand"
        [class.active]="currentLanguage() === 'en'"
        (click)="setLanguage('en')"
        aria-label="English" title="English">
        <img src="assets/flag-en.svg" alt="English flag" class="size-5 xl:size-6 object-contain" />
      </button>
      <button
        class="lang-btn flex items-center justify-center bg-transparent border border-transparent
          cursor-pointer p-1.5 size-9 xl:size-11 rounded-full transition-all duration-300
          hover:bg-brand/20 focus:outline-2 focus:outline-brand"
        [class.active]="currentLanguage() === 'ru'"
        (click)="setLanguage('ru')"
        aria-label="Русский" title="Русский">
        <img src="assets/flag-ru.svg" alt="Russian flag" class="size-5 xl:size-6 object-contain" />
      </button>
    </div>
  </div>
</nav>
