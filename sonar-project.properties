sonar.projectKey=E-KASA-Studio_tama-project
sonar.organization=e-kasa-studio


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=tama-project
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=src

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Tells Sonar to ignore UI templates, styles, and config files when calculating test coverage.
sonar.coverage.exclusions=**/*.html, **/*.css, **/*.scss, **/*.less, **/environment*.ts, **/*.module.ts, **/*.routing.ts

# Ignore the same files for code duplication checks
sonar.cpd.exclusions=**/*.html, **/*.css, **/*.scss, **/*.less