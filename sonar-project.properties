sonar.projectKey=E-KASA-Studio_tama-project
sonar.organization=e-kasa-studio


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=tama-project
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=src

# Test files are also located in src, but we need to tell Sonar to treat them as tests and not production code.
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Tells Sonar to ignore UI templates, styles, and config files when calculating test coverage.
sonar.coverage.exclusions=**/*.html, **/*.css, **/*.scss, **/*.less, **/environment*.ts, **/*.module.ts, **/*.routing.ts, **/*.spec.ts, **/models/*.ts

# Ignore the same files for code duplication checks
sonar.cpd.exclusions=**/*.html, **/*.css, **/*.scss, **/*.less,**/*.spec.ts

# Configure the path to the LCOV report generated by Karma. This is relative to the project root.
sonar.javascript.lcov.reportPaths=coverage/tama-project/lcov.info

sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:S5148
sonar.issue.ignore.multicriteria.e1.resourceKey=src/main/resources/templates/index.html